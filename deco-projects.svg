<svg width="170" height="215" viewBox="0 0 170 215" xmlns="http://www.w3.org/2000/svg">
  <rect width="170" height="215" fill="#0d1117"/>

  <text x="85" y="16" text-anchor="middle"
    font-family="'Cascadia Code','Fira Code','Courier New',monospace"
    font-size="8.5" letter-spacing="2" fill="rgba(88,166,255,0.55)">PROJECTS</text>

  <!-- Terminal frame -->
  <rect x="6" y="22" width="158" height="138" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Prompt -->
  <text y="40" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="8.5">
    <tspan x="14" fill="#57ab5a">gabriel@azure</tspan><tspan fill="#8b949e">:~/projects</tspan>
  </text>

  <text x="14" y="56" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="8" fill="#8b949e">$ git init</text>
  <text x="14" y="68" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="8" fill="#57ab5a">Initialized empty repo ✓</text>

  <text x="14" y="84" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="8" fill="#8b949e">$ git add .</text>
  <text x="14" y="96" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="8" fill="#8b949e">$ git commit -m "init"</text>

  <line x1="14" y1="104" x2="156" y2="104" stroke="#30363d" stroke-width="0.6" opacity="0.6"/>

  <text x="14" y="118" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="8" fill="#ffa657">building... &#x25AE;</text>

  <!-- Progress bar - ~12% -->
  <rect x="14" y="128" width="136" height="4" rx="2" fill="#21262d"/>
  <rect x="14" y="128" width="17" height="4" rx="2" fill="#ffa657" opacity="0.75"/>

  <text x="14" y="148" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="7" fill="#8b949e">0 repos publicados · em breve</text>


  <rect x="6" y="168" width="72" height="40" rx="4" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="42" y="185" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="7.5" fill="#30363d">repo-01</text>
  <text x="42" y="197" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="6.5" fill="#30363d">em breve</text>

  <rect x="92" y="168" width="72" height="40" rx="4" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="128" y="185" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="7.5" fill="#30363d">repo-02</text>
  <text x="128" y="197" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="6.5" fill="#30363d">em breve</text>

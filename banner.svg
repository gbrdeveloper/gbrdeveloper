<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="900" height="240" fill="#0d1117"/>
  <rect width="900" height="240" fill="url(#grid)"/>

  <line x1="58" y1="30" x2="58" y2="210" stroke="#388bfd" stroke-width="1.5" opacity="0.25"/>
  <line x1="842" y1="30" x2="842" y2="210" stroke="#388bfd" stroke-width="1.5" opacity="0.25"/>

  <!-- Terminal window -->
  <rect x="100" y="18" width="700" height="204" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="100" y="18" width="700" height="30" rx="8" fill="#21262d"/>
  <rect x="100" y="36" width="700" height="12" fill="#21262d"/>

  <!-- Traffic lights -->
  <circle cx="126" cy="33" r="5.5" fill="#ff5f57"/>
  <circle cx="146" cy="33" r="5.5" fill="#febc2e"/>
  <circle cx="166" cy="33" r="5.5" fill="#28c840"/>

  <text x="450" y="38" text-anchor="middle"
    font-family="'Cascadia Code','Fira Code','Courier New',monospace"
    font-size="11" fill="#8b949e">stack.yaml — gabriel@azure</text>

  <!-- Command prompt -->
  <text y="74" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="13">
    <tspan x="128" fill="#57ab5a">gabriel@azure</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">cat </tspan><tspan fill="#ffa657">stack.yaml</tspan>
  </text>

  <line x1="128" y1="84" x2="772" y2="84" stroke="#30363d" stroke-width="0.7" opacity="0.7"/>

  <!-- lang row -->
  <text y="103" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="12.5">
    <tspan x="128" fill="#8b949e">lang:  </tspan><tspan fill="#79c0ff">C#</tspan><tspan fill="#30363d" dx="2"> · </tspan><tspan fill="#79c0ff" dx="2">.NET 10</tspan><tspan fill="#30363d" dx="2"> · </tspan><tspan fill="#79c0ff" dx="2">TypeScript</tspan><tspan fill="#30363d" dx="2"> · </tspan><tspan fill="#79c0ff" dx="2">Angular</tspan>
  </text>

  <!-- cloud row -->
  <text y="124" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="12.5">
    <tspan x="128" fill="#8b949e">cloud: </tspan><tspan fill="#79c0ff">Azure</tspan><tspan fill="#30363d" dx="2"> · </tspan><tspan fill="#79c0ff" dx="2">Container Apps</tspan><tspan fill="#30363d" dx="2"> · </tspan><tspan fill="#79c0ff" dx="2">App Service</tspan><tspan fill="#30363d" dx="2"> · </tspan><tspan fill="#79c0ff" dx="2">DevOps</tspan>
  </text>

  <!-- data row -->
  <text y="145" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="12.5">
    <tspan x="128" fill="#8b949e">data:  </tspan><tspan fill="#79c0ff">SQL Server</tspan><tspan fill="#30363d" dx="2"> · </tspan><tspan fill="#79c0ff" dx="2">PostgreSQL</tspan><tspan fill="#30363d" dx="2"> · </tspan><tspan fill="#79c0ff" dx="2">EF Core</tspan><tspan fill="#30363d" dx="2"> · </tspan><tspan fill="#79c0ff" dx="2">RabbitMQ</tspan>
  </text>

  <!-- obs row -->
  <text y="166" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="12.5">
    <tspan x="128" fill="#8b949e">obs:   </tspan><tspan fill="#79c0ff">OpenTelemetry</tspan><tspan fill="#30363d" dx="2"> · </tspan><tspan fill="#79c0ff" dx="2">App Insights</tspan><tspan fill="#30363d" dx="2"> · </tspan><tspan fill="#79c0ff" dx="2">Grafana</tspan><tspan fill="#30363d" dx="2"> · </tspan><tspan fill="#79c0ff" dx="2">Docker</tspan>
  </text>

  <line x1="128" y1="176" x2="772" y2="176" stroke="#30363d" stroke-width="0.7" opacity="0.7"/>

  <!-- Second prompt -->
  <text y="196" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="13">
    <tspan x="128" fill="#57ab5a">gabriel@azure</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3" opacity="0.35">_</tspan>
  </text>

  <text x="450" y="228"
    text-anchor="middle"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-size="9" letter-spacing="2.5"
    fill="rgba(230,237,243,0.17)">ARQUITETO DE SOLU&#xC7;&#xD5;ES EM NUVEM E SOFTWARE &#xB7; ENGENHEIRO DE SOFTWARE S&#xCA;NIOR</text>
</svg>

<svg width="170" height="215" viewBox="0 0 170 215" xmlns="http://www.w3.org/2000/svg">
  <rect width="170" height="215" fill="#0d1117"/>

  <text x="85" y="16" text-anchor="middle"
    font-family="'Cascadia Code','Fira Code','Courier New',monospace"
    font-size="8.5" letter-spacing="2" fill="rgba(88,166,255,0.55)">ARCHITECTURE</text>

  <!-- API Gateway (top) -->
  <rect x="22" y="24" width="126" height="26" rx="4" fill="#161b22" stroke="#388bfd" stroke-width="1.3"/>
  <text x="85" y="35" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="9" fill="#79c0ff">API Gateway</text>
  <text x="85" y="45" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="7" fill="#8b949e">ASP.NET Core</text>

  <!-- Arrow down from gateway -->
  <line x1="85" y1="50" x2="85" y2="66" stroke="#388bfd" stroke-width="1" opacity="0.45"/>
  <polygon points="81,62 85,70 89,62" fill="#388bfd" opacity="0.45"/>

  <!-- Branch lines -->
  <line x1="85" y1="70" x2="42" y2="82" stroke="#388bfd" stroke-width="0.9" opacity="0.35"/>
  <line x1="85" y1="70" x2="128" y2="82" stroke="#388bfd" stroke-width="0.9" opacity="0.35"/>

  <!-- .NET Service (left) -->
  <rect x="8" y="82" width="68" height="30" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="42" y="95" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="9" fill="#e6edf3">.NET API</text>
  <text x="42" y="106" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="7" fill="#8b949e">C# · DDD · CQRS</text>

  <!-- Service Bus (right) -->
  <rect x="94" y="82" width="68" height="30" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="128" y="95" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="9" fill="#e6edf3">Msg Queue</text>
  <text x="128" y="106" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="7" fill="#8b949e">RabbitMQ · SvcBus</text>

  <!-- Lines down to DB -->
  <line x1="42" y1="112" x2="60" y2="130" stroke="#388bfd" stroke-width="0.9" opacity="0.35"/>
  <line x1="128" y1="112" x2="110" y2="130" stroke="#388bfd" stroke-width="0.9" opacity="0.35"/>

  <!-- Database cylinder -->
  <ellipse cx="85" cy="131" rx="38" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="47" y="131" width="76" height="20" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-top="none"/>
  <line x1="47" y1="131" x2="47" y2="151" stroke="#30363d" stroke-width="1"/>
  <line x1="123" y1="131" x2="123" y2="151" stroke="#30363d" stroke-width="1"/>
  <ellipse cx="85" cy="151" rx="38" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="85" y="143" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="8.5" fill="#e6edf3">SQL / PostgreSQL</text>

  <!-- Arrow to OTel -->
  <line x1="85" y1="159" x2="85" y2="171" stroke="#57ab5a" stroke-width="1" opacity="0.4"/>

  <!-- OpenTelemetry bar -->
  <rect x="8" y="171" width="154" height="36" rx="4" fill="#0d1117" stroke="#57ab5a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="85" y="184" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="7.5" fill="#57ab5a">OpenTelemetry</text>
  <text x="85" y="198" text-anchor="middle" font-family="'Cascadia Code','Fira Code','Courier New',monospace" font-size="7" fill="rgba(87,171,90,0.65)">App Insights · Grafana</text>
</svg>
